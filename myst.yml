version: 1
project:
  id: ds-skript
  short_title: DS
  title: Data Science Vorlesungsskript
  subtitle: im Bachelor Informatik
  description: Skript zur Vorlesung an der HHU
  authors:
    - name: Dr. Konrad Völkel
      affiliations:
        - Heinrich-Heine Universität Düsseldorf
      url: http://www.konradvoelkel.com
  license: CC-BY-SA-4.0
  copyright: 2026 CC-BY-SA 4.0
  exclude:
    - README.md
    - slides/**
    - LICENSE
    - .git/*
    - .venv/*
  bibliography:
    - references.bib
  settings:
    myst_to_tex:
      code_style: listings
  exports:
    - format: pdf
      template: ./templates/tex/ds-skript
      output: exports/ds-skript.pdf
  toc:
    - file: landing-page.md
    - title: Einführung
      children:
        - file: was-ist-data-science.md
        - file: intro-stochastik.md
        - file: intro-python.ipynb
    - title: Diskrete Stochastik und Numpy
      children:
        - file: stochastik-programmieren.ipynb
        - file: zufallsvariablen-verteilungen.md
        - file: erwartungswert.md
        - file: numpy.ipynb
        - file: wichtigste-diskrete-verteilungen.ipynb
        - file: explorative-analyse-mit-numpy.ipynb
    - title: Stetige Stochastik und Scipy
      children:
        - file: stetige-verteilungen.md
        - file: normalverteilung.ipynb
        - file: wichtigste-stetige-verteilungen.ipynb
    - title: Explorative Datenanalyse
      children:
        - file: deskriptive-statistik.md
        - file: explorative-analyse-beispiele.ipynb
        - file: iris.ipynb
        - file: pandas.ipynb
        - file: data-cleaning.ipynb
    - title: Multivariate Stochastik
      children:
        - file: kovarianz.md
        - file: multivariate-normalverteilung.ipynb
        - file: relative-entropie.md
    - title: Datenschutz
      children:
        - file: datenschutz.md
    - title: Maschinelles Lernen
      children:
        - file: kmeans.ipynb
        - file: statistische-modelle.md
        - file: dimensionsreduktion.ipynb
        - file: lineare-regression.ipynb
        - file: kernel-methoden.ipynb
        - file: statistische-tests.md
        - file: model-selection.ipynb
        - file: expectation-maximization.ipynb
    - file: folien.md
site:
  options:
    logo: images/logo-wide.svg
    favicon: images/favicon.ico
    folders: true
    style: _site/custom-style.css
  template: book-theme
