version: 1
project:
  id: ds-skript
  short_title: DS
  title: Data Science Vorlesungsskript
  subtitle: im Bachelor Informatik
  description: "Vorlesungsskript Data Science: Stochastik, Statistik und Python von den Grundlagen bis zum maschinellen Lernen, mit selbst programmierten Lernverfahren."
  # Vorschaukarte für alle Seiten ohne eigene Abbildung. Ohne diese Zeile greift MyST auf
  # das erste Bild des Projekts zurück — den CC-BY-SA-Knopf aus dem Lizenzabschnitt der
  # Landingpage, 267x50. Das liegt unter den 200x200, die Facebook und LinkedIn fordern,
  # also blieb die Vorschaukarte auf 18 von 32 Seiten ganz aus. Neu erzeugen mit
  # tools/social_card.py.
  thumbnail: images/social-card.png
  authors:
    - name: Dr. Konrad Völkel
      affiliations:
        - Heinrich-Heine Universität Düsseldorf
      url: http://www.konradvoelkel.com
  license: CC-BY-SA-4.0
  copyright: 2026 CC-BY-SA 4.0
  exclude:
    - README.md
    - slides/**
    - LICENSE
    - .git/*
    - .venv/*
  bibliography:
    - references.bib
  settings:
    myst_to_tex:
      code_style: listings
  exports:
    - format: pdf
      template: ./templates/tex/ds-skript
      output: exports/ds-skript.pdf
      articles:
        - title: 'Einführung'
          level: 1
        - file: was-ist-data-science.md
          level: 2
        - file: intro-stochastik.md
          level: 2
        - file: intro-python.ipynb
          level: 2
        - title: 'Diskrete Stochastik und Numpy'
          level: 1
        - file: stochastik-programmieren.ipynb
          level: 2
        - file: zufallsvariablen-verteilungen.md
          level: 2
        - file: erwartungswert.md
          level: 2
        - file: numpy.ipynb
          level: 2
        - file: wichtigste-diskrete-verteilungen.ipynb
          level: 2
        - file: explorative-analyse-mit-numpy.ipynb
          level: 2
        - title: 'Stetige Stochastik und Scipy'
          level: 1
        - file: stetige-verteilungen.md
          level: 2
        - file: normalverteilung.ipynb
          level: 2
        - file: wichtigste-stetige-verteilungen.ipynb
          level: 2
        - title: 'Explorative Datenanalyse'
          level: 1
        - file: deskriptive-statistik.md
          level: 2
        - file: explorative-analyse-beispiele.ipynb
          level: 2
        - file: iris.ipynb
          level: 2
        - file: pandas.ipynb
          level: 2
        - file: data-cleaning.ipynb
          level: 2
        - title: 'Multivariate Stochastik'
          level: 1
        - file: kovarianz.md
          level: 2
        - file: multivariate-normalverteilung.ipynb
          level: 2
        - file: relative-entropie.md
          level: 2
        - title: 'Datenschutz'
          level: 1
        - file: datenschutz.md
          level: 2
        - title: 'Maschinelles Lernen'
          level: 1
        - file: kmeans.ipynb
          level: 2
        - file: statistische-modelle.md
          level: 2
        - file: dimensionsreduktion.ipynb
          level: 2
        - file: lineare-regression.ipynb
          level: 2
        - file: kernel-methoden.ipynb
          level: 2
        - file: statistische-tests.md
          level: 2
        - file: model-selection.ipynb
          level: 2
        - file: expectation-maximization.ipynb
          level: 2
        - file: folien.md
          level: 1
  toc:
    - file: landing-page.md
    - title: Einführung
      children:
        - file: was-ist-data-science.md
        - file: intro-stochastik.md
        - file: intro-python.ipynb
    - title: Diskrete Stochastik und Numpy
      children:
        - file: stochastik-programmieren.ipynb
        - file: zufallsvariablen-verteilungen.md
        - file: erwartungswert.md
        - file: numpy.ipynb
        - file: wichtigste-diskrete-verteilungen.ipynb
        - file: explorative-analyse-mit-numpy.ipynb
    - title: Stetige Stochastik und Scipy
      children:
        - file: stetige-verteilungen.md
        - file: normalverteilung.ipynb
        - file: wichtigste-stetige-verteilungen.ipynb
    - title: Explorative Datenanalyse
      children:
        - file: deskriptive-statistik.md
        - file: explorative-analyse-beispiele.ipynb
        - file: iris.ipynb
        - file: pandas.ipynb
        - file: data-cleaning.ipynb
    - title: Multivariate Stochastik
      children:
        - file: kovarianz.md
        - file: multivariate-normalverteilung.ipynb
        - file: relative-entropie.md
    - title: Datenschutz
      children:
        - file: datenschutz.md
    - title: Maschinelles Lernen
      children:
        - file: kmeans.ipynb
        - file: statistische-modelle.md
        - file: dimensionsreduktion.ipynb
        - file: lineare-regression.ipynb
        - file: kernel-methoden.ipynb
        - file: statistische-tests.md
        - file: model-selection.ipynb
        - file: expectation-maximization.ipynb
    - file: folien.md
    - file: orga.md
site:
  options:
    logo: images/logo-wide.svg
    logo_alt: "Data Science: Vorlesungsskript"
    favicon: images/favicon.ico
    folders: true
    style: _site/custom-style.css
  template: book-theme
