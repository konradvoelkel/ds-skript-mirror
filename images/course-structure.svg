<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 994" width="920" height="994" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Wie die Teile der Vorlesung aufeinander aufbauen</title>
<desc id="dsc">Sieben Teile nacheinander, jeder führt zum nächsten: Einführung (Was ist Data Science?, Stochastik, Python); Diskrete Stochastik und Numpy (Zufallsvariablen, Verteilungen, Erwartungswert, Numpy, Diskrete Verteilungen, erste Exploration); Stetige Stochastik und Scipy (Stetige Verteilungen, Normalverteilung, Scipy); Explorative Datenanalyse (Deskriptive Statistik, Beispiele, Iris, Pandas, Daten putzen); Multivariate Stochastik (Kovarianz, multivariate Normalverteilung, relative Entropie); Datenschutz (Datenschutz-Glossar); Maschinelles Lernen (Clustering, Dimensionsreduktion, Statistische Modelle, Regression, Kernel, Tests, Modellwahl, Expectation Maximization).</desc>
<style>
  :root { color-scheme: light dark; }
  .band  { fill: #d8f5f5; stroke: #a9dede; }
  .node  { fill: #ffffff; stroke: #007d7e; stroke-width: 1.5; }
  .ptitle{ fill: #006364; font-weight: 600; }
  .ntext { fill: #1a1a1a; }
  .arrow { stroke: #007d7e; stroke-width: 2; fill: none; }
  .head  { fill: #007d7e; }
  text { font-family: Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  @media (prefers-color-scheme: dark) {
    .band  { fill: #16211f; stroke: #2a3d3c; }
    .node  { fill: #1b2225; stroke: #2cc5c5; }
    .ptitle{ fill: #6fdcdc; }
    .ntext { fill: #e9ecef; }
    .arrow { stroke: #2cc5c5; }
    .head  { fill: #2cc5c5; }
  }
</style>
