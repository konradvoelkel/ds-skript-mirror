stages:
  - build
  - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  BASE_URL: "/$CI_PROJECT_NAME"
  HOST: "127.0.0.1"

cache:
  paths:
    - .cache/pip

build-web:
  stage: build
  image: $CI_REGISTRY_IMAGE:latest
  script:
    - uv sync
    - uv run myst build --html
  artifacts:
    paths:
      - _build/html

build-pdf:
  stage: build
  image: $CI_REGISTRY_IMAGE:latest
  script:
    - uv sync
    - uv run myst build --pdf
  allow_failure: true
  artifacts:
    paths:
      - exports/ds-skript.pdf

pages:
  stage: deploy
  image: busybox:latest
  script:
    - mv _build/html public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
