stages:
  - image
  - build
  - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  BASE_URL: "/$CI_PROJECT_NAME"
  HOST: "127.0.0.1"
  # Origin der veroeffentlichten Seite. BASE_URL setzt nur den *Pfad*; MyST 1.10 hat keine
  # Einstellung fuer die Origin, deshalb steht sie hier und wird im pages-Job nachgetragen.
  SITE_ORIGIN: "https://voelkel.pages.cs.uni-duesseldorf.de"
  # Die englische Ausgabe. Zieht sie um, wandern beide Haelften des Sprachpaars zusammen:
  # hier diese Zeile, drueben DE_SITE in .github/workflows/pages.yml.
  EN_SITE_ORIGIN: "https://datascience.konradvoelkel.com"

cache:
  paths:
    - .cache/pip

# Baut das CI-Image aus dem Dockerfile und schiebt es in die Registry des Projekts.
# Ersetzt den Push von Hand (push-image.sh); Kaniko braucht keinen Docker-Daemon und
# laeuft deshalb auf jedem Shared Runner. Laeuft automatisch nur auf dem Default-Branch
# und nur, wenn sich Dockerfile oder requirements.txt geaendert haben; sonst steht der
# Job als manuell startbarer Knopf in der Pipeline (Rebuild erzwingen).
build-image:
  stage: image
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  before_script:
    - mkdir -p /kaniko/.docker
    - |
      echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
  script:
    - >
      /kaniko/executor
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/Dockerfile"
      --destination "$CI_REGISTRY_IMAGE:latest"
      --destination "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
      --cache=true
      --cache-repo "$CI_REGISTRY_IMAGE/cache"
      --cache-ttl=336h
      --snapshot-mode=redo
  rules:
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - Dockerfile
        - requirements.txt
    - when: manual
      allow_failure: true

# Die Buchstruktur steht in myst.yml zweimal: als project.toc (Web) und als
# exports[].articles (PDF). Die Dopplung ist noetig, weil MyST keine Moeglichkeit hat, eine
# einzelne Seite vom PDF auszunehmen -- und orga.md soll nicht ins gedruckte Buch. Dieser
# Vergleich bricht ab, wenn beide auseinanderlaufen; sonst verschwaende ein neues Kapitel
# stillschweigend aus dem PDF. Eigener Job und *kein* allow_failure, denn build-pdf darf
# fehlschlagen, diese Pruefung nicht: sie ist deterministisch und braucht kein TeX.
check-structure:
  stage: build
  image: $CI_REGISTRY_IMAGE:latest
  script:
    # --with pyyaml: nur fuer diesen Lauf, damit das Buch keine Abhaengigkeit fuer ein
    # Pruefskript bekommt.
    - uv run --with pyyaml python tools/check_pdf_articles.py
    # Das Uebersichtsdiagramm der Landingpage ist ein erzeugtes SVG (tools/course_diagram.py),
    # kein Mermaid-Block mehr. Damit steht die Teil-Gliederung des Buchs an *noch* einer Stelle,
    # und das ist dieselbe Driftfalle wie toc gegen articles: eine umbenannte Teil-Ueberschrift
    # liesse sonst stillschweigend ein Diagramm stehen, das etwas anderes behauptet als das
    # Inhaltsverzeichnis daneben. --check vergleicht beides und prueft zugleich, dass das
    # eingecheckte SVG zum Skript passt. Erzeugt wird es nicht hier, sondern von Hand.
    - uv run --with pyyaml python tools/course_diagram.py --check
    # Die Alternativtexte der Abbildungen stehen in alt-texte.yml und werden von
    # tools/alt_texts.py in die text/plain-Ausgaben der Notebooks geschrieben -- MyST nimmt
    # genau die als alt. Ein Neuausfuehren eines Notebooks setzt sie auf das
    # Matplotlib-Repr ("<Figure size 640x480 with 1 Axes>") zurueck, und das faellt sonst
    # niemandem auf: das alt-Attribut ist dann *da*, es sagt nur nichts. --check schlaegt
    # an, wenn jemand nach dem Ausfuehren das --apply vergisst.
    - uv run --with pyyaml python tools/alt_texts.py --check
    # Das Navbar-Logo wird ausgeliefert als images/logo-wide.png, gerendert aus dem SVG
    # (tools/logo_raster.py). Kein byte-exakter Vergleich: die PNG entsteht aus librsvg
    # oder Inkscape gegen die cairo- und Schriftversionen der jeweiligen Maschine, ein
    # Bytevergleich scheiterte an Dingen, die mit dem Logo nichts zu tun haben. Geprueft
    # wird, was zaehlt und worueber kein Renderer anderer Meinung ist: 216x108, ein
    # Farbtyp der Transparenz tragen kann (sonst ist das Logo im Dunkelmodus ein Block),
    # und ein Seitenverhaeltnis, das noch zum viewBox des SVG passt.
    - python3 tools/logo_raster.py --verify
    # Die eingecheckten Bilder in images/ muessen optimiert sein. --check kodiert das
    # Repository nicht hinter dem Ruecken neu, sondern scheitert und sagt, was zu tun
    # ist. Am 2026-10-16 waren hier 5,3 von 9,0 MB zu holen: Matplotlib und die
    # Zeichenprogramme schreiben RGBA, ein Plot hat aber keine Transparenz, und PNG
    # komprimiert vier Kanaele viel schlechter als einen.
    - uv run --with pillow --with numpy python tools/optimize_images.py images/ --max-width 1600 --check
  # Holt pyyaml von PyPI, haengt also an derselben flatternden Strecke wie build-web.
  retry: 2

# Frischt die Zuordnung deutscher auf englische Kapitel aus ds-en auf. Sie ist dort die eine
# Quelle der Wahrheit (die Staleness-Werkzeuge laufen auf derselben Datei) -- eine zweite
# *gepflegte* Kopie hier wuerde irgendwann leise auseinanderlaufen.
#
# **hreflang/filemap.json liegt trotzdem eingecheckt im Repo, als Rueckfallebene.** Das Artefakt
# dieses Jobs liegt unter demselben Pfad und ueberschreibt die ausgecheckte Fassung; scheitert
# der Abruf, bleibt die eingecheckte stehen. Ohne diese Ebene hiesse ein zweiminuetiger
# GitHub-Aussetzer: eine Ausgabe ganz ohne hreflang, beide Jobs gruen -- und weil ein
# einseitiges hreflang von Google ignoriert wird, faellt die englische Haelfte mit, aus 30/30
# wird 0/30 auf beiden Seiten. GitLab reicht Artefakte nur innerhalb derselben Pipeline weiter,
# ein erfolgreicher Lauf von gestern hilft also nicht.
#
# allow_failure bleibt richtig: der Abruf darf scheitern, weil die Rueckfallebene traegt. Weicht
# die geholte Karte von der eingecheckten ab, sagt das Skript im Log, welche Kapitel betroffen
# sind -- dann ist ein Commit faellig. retry: 2, weil die Strecke nach draussen flattert.
hreflang-map:
  stage: build
  image: python:3.13-alpine
  script:
    - python3 tools/hreflang.py --fetch hreflang/filemap.json
  artifacts:
    paths:
      - hreflang/filemap.json
  allow_failure: true
  retry: 2
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

build-web:
  stage: build
  image: $CI_REGISTRY_IMAGE:latest
  variables:
    # freshness.py liest das Datum aus "git log". Bei einem flachen Klon bricht es ab --
    # und muss das auch, siehe refuse_shallow(): bei Tiefe 1 meldet git fuer *jede* Datei
    # das Datum von HEAD, und dann traegt jede Seite die Sekunde des Deploys.
    GIT_DEPTH: "0"
  script:
    - uv sync
    # Stand der Ausgabe in den Frontmatter der Landingpage schreiben, vor dem Bau. Nur dort:
    # ein Projekt-Datum in myst.yml stuende auf allen 32 Seiten gleich, und 16 davon haetten
    # damit ein Datum behauptet, das ihr Quelltext nicht hergibt. Braucht die volle Historie,
    # siehe GIT_DEPTH.
    - uv run --with pyyaml python tools/freshness.py --stamp-source
    - uv run myst build --html
    # --- Gescheiterte Formeln zaehlen ---------------------------------------------------
    # Eine Formel, die KaTeX nicht uebersetzt, ist strukturell perfekt: ein span mit Text
    # darin, kein Fehlerstatus, nichts fehlt, und "myst build" sagt kein Wort. MyST rendert
    # sie als den rohen Quelltext hinter einem Warndreieck. Am 2026-10-16 standen so sechs
    # "\\,^\\circ" in deskriptive-statistik.md monatelang als LaTeX auf der Seite -- gefunden
    # hat sie ein Mensch beim Lesen, nicht eine der Pruefungen.
    #
    # Gezaehlt wird auf title=, NICHT auf die Klasse allein: dieselbe Klasse formatiert die
    # eigenen {warning}-Admonitions des Buchs, und die haben kein title-Attribut. Am
    # 2026-10-16 waren das 6 Klassentreffer bei 0 Warndreiecken (wichtigste-diskrete-
    # verteilungen, lineare-regression) -- auf die Klasse gezaehlt waere der Job rot
    # gewesen, ohne dass etwas kaputt war.
    - |
      # Das "|| true" ist der Kern dieser Zeile, nicht Kosmetik. GitLab fuehrt script mit
      # "set -eo pipefail" aus; "find -exec grep +" endet mit 1, wenn grep nichts findet,
      # und das ist hier der GUTFALL. Ohne die Klammer riss pipefail die Pipe und errexit
      # brach die Zuweisung ab, bevor ein echo kam: Job rot, Log ohne eine einzige
      # Meldung, und zwar genau dann, wenn keine Formel kaputt war. Nachgewiesen am
      # 2026-10-16, Pipeline 183640, Job 669082.
      n=$( { find _build/html -name index.html -exec grep -oh 'text-myst-warning-text" title="' {} + || true; } | wc -l )
      if [ "$n" -ne 0 ]; then
        echo "FEHLER: $n Formel(n) rendern als roher LaTeX-Quelltext statt als Mathematik."
        find _build/html -name index.html -exec grep -l 'text-myst-warning-text" title="' {} + \
          | sed 's|_build/html/|  betroffen: |'
        exit 1
      fi
      echo "ok: keine gescheiterten Formeln"
    # --- Schriften mitkopieren und den Dritten verriegeln -------------------------------
    # Bis zum 2026-10-16 zog custom-style.css die Schriften per @import von
    # fonts.googleapis.com. Begruendung und Herkunft: _site/fonts/PROVENANCE.txt.
    # MyST kopiert aus _site/ nur das Stylesheet selbst, die Schriften also hier.
    # Der url() im CSS ist relativ zu build/custom-style-<hash>.css, darum ../fonts/.
    - mkdir -p _build/html/fonts
    - cp _site/fonts/*.woff2 _build/html/fonts/
    # Die Lizenzen muessen mitreisen (OFL 1.1), auch in der ausgelieferten Fassung.
    - cp _site/fonts/OFL-*.txt _build/html/fonts/
    - |
      for f in inter-latin.woff2 jetbrains-mono-latin.woff2; do
        [ -s "_build/html/fonts/$f" ] || { echo "FEHLER: _build/html/fonts/$f fehlt"; exit 1; }
      done
      # Gezaehlt wird MIT Schema. Ohne Schema trifft das Muster den Kommentar in
      # custom-style.css, der die Entfernung erklaert -- am 2026-10-16 zwei Treffer, die
      # den Job rot gemacht haetten, ohne dass etwas kaputt war.
      #
      # Und nur ueber die Dateien, die ein Browser wirklich laedt: das gebaute HTML und
      # die Stylesheets, die es referenziert. Ein rekursives grep ueber build/ trifft die
      # fingerprinted Kopien aelterer Builds, die MyST dort liegen laesst.
      # Ebenfalls mit "|| true": findet grep hier nichts, ist das ein Befund und keine
      # Panne -- die Pruefung unten faellt dann auf die HTML-Dateien zurueck, statt dass
      # der Job ohne Meldung stirbt.
      css=$( { grep -oh '/build/[^"]*\.css' _build/html/index.html || true; } | sort -u | sed 's|^/|_build/html/|' )
      ziele="$(find _build/html -name '*.html') $css"
      treffer=$(grep -l -E 'https://fonts\.(googleapis|gstatic)\.com' $ziele 2>/dev/null || true)
      if [ -n "$treffer" ]; then
        echo "FEHLER: ausgeliefertes Artefakt fragt wieder bei Google Fonts an:"
        echo "$treffer" | sed 's|^|  |'
        exit 1
      fi
      echo "ok: Schriften liegen lokal, kein Google-Fonts-Abruf in $(echo $ziele | wc -w) Dateien"
    # --- Die gebauten PNG neu kodieren ------------------------------------------------
    # Hier liegen auch die Bildausgaben der Notebooks: MyST schreibt die eingebetteten
    # base64-Ausgaben beim Bauen als Dateien nach build/. Deshalb ist dieser Gewinn ohne
    # eine einzige Aenderung an den 15 Notebooks mit Bildausgaben zu haben -- und ein
    # Neuausfuehren eines Notebooks macht hier nichts kaputt.
    #
    # Ohne --max-width: Matplotlib hat die in der Figurengroesse geschrieben, die das
    # Notebook verlangt hat, sie kommen also etwa in Anzeigegroesse an. Sie
    # herunterzurechnen hiesse, einen Plot schlecht neu zu rendern statt ein Bild gut zu
    # komprimieren. Die Kappung gilt nur fuer die handgemachten Quellen in images/,
    # geprueft in check-structure.
    #
    # Die Dateinamen bleiben, wie MyST sie vergeben hat -- der Fingerabdruck stammt aus
    # der Quelle, nicht aus dem Inhalt der gebauten Datei. Nur die Bytes werden kleiner.
    - uv run --with pillow --with numpy python tools/optimize_images.py _build/html/build
  # Am 2026-10-15 nach 149 s in einen Connect-Timeout gegen PyPI gelaufen und damit die ganze
  # deploy-Stage uebersprungen (pages und notify-ds-en: skipped). Dieselbe flatternde Strecke
  # wie bei notify-ds-en, derselbe Griff.
  retry: 2
  artifacts:
    paths:
      - _build/html

build-pdf:
  stage: build
  image: $CI_REGISTRY_IMAGE:latest
  variables:
    # freshness.py liest das Datum aus "git log". Bei einem flachen Klon bricht es ab --
    # und muss das auch, siehe refuse_shallow(): bei Tiefe 1 meldet git fuer *jede* Datei
    # das Datum von HEAD, und dann traegt jede Seite die Sekunde des Deploys.
    GIT_DEPTH: "0"
  script:
    - uv sync
    # Stand der Ausgabe in den Frontmatter der Landingpage schreiben, vor dem Bau. Nur dort:
    # ein Projekt-Datum in myst.yml stuende auf allen 32 Seiten gleich, und 16 davon haetten
    # damit ein Datum behauptet, das ihr Quelltext nicht hergibt. Braucht die volle Historie,
    # siehe GIT_DEPTH.
    - uv run --with pyyaml python tools/freshness.py --stamp-source
    - uv run myst build --pdf
  allow_failure: true
  retry: 2
  artifacts:
    paths:
      - exports/ds-skript.pdf

pages:
  stage: deploy
  # Frueher busybox:latest. Jetzt Alpine mit Python, weil der hreflang-Schritt JSON lesen muss;
  # die Shell-Werkzeuge darunter sind dieselbe Busybox, die sed/find-Kette bleibt unveraendert.
  image: python:3.13-alpine
  script:
    # git nachinstallieren: python:3.13-alpine bringt keins mit, und freshness.py liest das
    # Datum je Kapitel aus "git log" der Quelldatei. Ohne diese Zeile bricht der Job ab --
    # nachgewiesen am 2026-10-16, Pipeline nach e229a9d: der Ruf an ds-en ging raus (gleiche
    # Stage), pages fiel aus, und die Seite blieb auf dem Stand von 07:55 stehen.
    #
    # brotli dazu: Python kennt das Verfahren nicht (weder Standardbibliothek noch Image),
    # und tools/precompress.py ruft deshalb das Programm auf. Fehlt es, bricht das Skript
    # ab statt die .br still weglassen -- eine Seite, die unbemerkt wieder 15 % groesser
    # ausgeliefert wird, faellt niemandem auf.
    - apk add --no-cache git brotli >/dev/null
    - mv _build/html public
    - cp exports/ds-skript.pdf public/ || echo "no PDF in this run"
    # Die Bestaetigungsdatei der Google Search Console. Sie muss **unter dem Pfad der Property**
    # liegen, also unter /ds-skript/ -- eine Property auf dem Host-Wurzelverzeichnis waere nicht
    # zu bestaetigen, weil GitLab dort auf seinen Login weiterleitet (dieselbe Lage, die schon
    # die robots.txt unwirksam macht, siehe todo/geo-bewertung.md Abschnitt 1).
    #
    # Nicht die Meta-Tag-Variante: dieses Theme rendert den <head> bei der Hydration neu und
    # wirft nachgetragene Tags weg (TODO Zeile 1d). Google liest beim Bestaetigen das
    # Rohdokument, es haette also wahrscheinlich funktioniert -- aber eine Datei stellt die
    # Frage gar nicht erst. Kein Fehlerzweig: fehlt sie, soll der Job abbrechen, denn eine
    # stillschweigend nicht mehr ausgelieferte Datei nimmt der Console die Bestaetigung
    # wieder weg.
    - cp _site/google0dd174ae44033090.html public/
    # --- Absolute URLs nachtragen -------------------------------------------------------
    # MyST holt robots.txt und sitemap.xml beim statischen Bau vom eigenen Dev-Server und
    # schreibt dessen Origin hinein: ohne diesen Schritt enthaelt die deployte sitemap.xml
    # 31 mal "http://localhost:3000", und robots.txt nennt die Sitemap genau dort. Fuer
    # Crawler ist die Seite damit ohne Sitemap. Es gibt keine Konfiguration dafuer (MyST
    # 1.10 kennt kein SITE_URL), also hier.
    - SITE="$SITE_ORIGIN$BASE_URL"
    - sed -i "s|http://localhost:3000|$SITE|g" public/sitemap.xml public/robots.txt
    # Jede <loc> auf die URL bringen, die wirklich 200 liefert. GitLab Pages leitet
    # "/ds-skript/numpy" per 302 auf "/ds-skript/numpy/" um; MyST schreibt aber die Form ohne
    # Schraegstrich in die Sitemap. Eine Sitemap voller Weiterleitungen (und ein Canonical, der
    # auf eine Weiterleitung zeigt) ist unnoetig unklar, also hier den Schraegstrich ergaenzen.
    - sed -i "s|<loc>\\($SITE[^<]*[^/]\\)</loc>|<loc>\\1/</loc>|g" public/sitemap.xml
    - sed -i "s|<loc>$SITE</loc>|<loc>$SITE/</loc>|" public/sitemap.xml
    # og:image ist wurzelrelativ ("/ds-skript/build/<hash>.png"). OpenGraph verlangt eine
    # absolute URL, sonst bleibt die Vorschaukarte in Slack, LinkedIn und Mastodon leer.
    - find public -name '*.html' -exec sed -i "s|content=\"$BASE_URL/build/|content=\"$SITE/build/|g" {} +
    # Canonical: MyST emittiert keinen. Je Seite einen setzen, damit PDF-Kopien und ein
    # spaeterer Umzug nicht als Dubletten gewertet werden.
    - |
      for f in $(find public -name 'index.html'); do
        rel=$(dirname "${f#public/}")
        # MIT Schraegstrich: das ist die URL, die 200 liefert. Die Seite verlinkt ihre
        # Unterseiten zwar als "/ds-skript/numpy", aber darauf antwortet GitLab Pages mit 302
        # auf "/ds-skript/numpy/". Ein Canonical darf nicht auf eine Weiterleitung zeigen.
        if [ "$rel" = "." ]; then url="$SITE/"; else url="$SITE/$rel/"; fi
        grep -q 'rel="canonical"' "$f" || sed -i "s|</head>|<link rel=\"canonical\" href=\"$url\"/></head>|" "$f"
      done
    # og:url und og:site_name nachtragen, die Schriften vorladen, und die Abbildungen
    # unter der Falz verzoegert laden. Muss *nach* dem Canonical laufen: og:url bekommt
    # dieselbe URL, die der Canonical nennt.
    #
    # Das lazy-Attribut allein waere wirkungslos gewesen -- MyST schreibt fuer *jedes*
    # Bild ein <link rel=preload as=image>, und ein vorgeladenes Bild wird sofort geholt,
    # was loading auch sagt. Am 2026-10-16 waren das 228 Preloads bei null lazy; danach
    # 171 lazy und 57 Preloads, naemlich je Seite das Logo und die erste Abbildung.
    # Die drei fremden Stylesheets des Themes von hier ausliefern statt von zwei CDN.
    # Laeuft vor head_meta, wie in ds-en. Begruendung, Hashes und Lizenzen:
    # _site/vendor/PROVENANCE.txt.
    #
    # Mehr als ein sed, weil die URLs auch im Client-JavaScript stehen: Remix rendert
    # die <head>-Links aus Route-Modulen. Am 2026-10-16 nachgemessen, je URL 32
    # HTML-Dateien *und* ein Bundle. Nur das Markup umzuschreiben hiesse, die Seite
    # laedt richtig und fuegt bei der Hydration die CDN-Links wieder hinzu -- holt also
    # beide Kopien, schlechter als vorher und unsichtbar ohne Netzwerkprotokoll.
    # __BASE__ in den Schrift-URLs von custom-style.css durch BASE_URL ersetzen. MyST legt
    # dieses Stylesheet zweimal ab -- als myst-theme.css im Wurzelpfad und fingerprinted
    # unter build/ --, und das HTML bindet die Kopie im Wurzelpfad ein. Ein relativer url()
    # kann fuer beide Orte nicht stimmen: am 2026-10-16 zeigte "../fonts/" von
    # /ds-skript/myst-theme.css aus auf den Server-Root, Antwort 302, und die deutsche
    # Ausgabe lief still mit der Systemschrift, waehrend die englische Inter zeigte.
    - find public -name 'myst-theme.css' -o -name 'custom-style-*.css' | xargs sed -i "s|__BASE__|$BASE_URL|g"
    - python3 tools/vendor_assets.py public --base "$BASE_URL"
    # Setzt ausserdem lang="de" am <html> -- das Theme schreibt "en" hart ins Bundle, und
    # myst.yml hat keinen Schalter dafuer. Dass das Markup hier reicht (anders als beim
    # Titel, der aus der Hydrations-Nutzlast neu gerendert wird), ist am 2026-10-16 lokal
    # gegen dasselbe Bundle gemessen: nach der Hydration und nach einer Navigation "de".
    - python3 tools/head_meta.py "$SITE" public --base "$BASE_URL" --lang de
    # Die echten Pixelmasse an jede Abbildung, gegen den Layoutsprung: als width/height
    # ins Markup und als <style id="bildmasse"> in den Kopf. Ohne sie kennt der Browser
    # das Seitenverhaeltnis erst, wenn die ersten Bytes des Bildes da sind; bis dahin ist
    # die Abbildung null Pixel hoch, und alles darunter ruckt nach unten, sobald sie
    # ankommt.
    #
    # Laeuft *nach* head_meta, und das ist keine Vorliebe: dort bekommen die Abbildungen
    # ihr loading="lazy", und erst beides zusammen stellt die Lage eines Lesers her --
    # ein verzoegert geladenes Bild ohne Masse ruckt genau in dem Moment, in dem er es
    # erreicht. Und *vor* hydration.py, denn dessen Waechter haengt das Stylesheet
    # zurueck, wenn React den Kopf ausraeumt.
    #
    # Warum zwei Stellen: die Attribute halten nur bis zur Hydration. Die schlaegt bei
    # diesem Theme fehl (React #418) und rendert das ganze Dokument neu, Koerper
    # inbegriffen -- danach traegt kein <img> mehr seine Masse. Am 2026-10-29 gegen
    # dasselbe Bundle gemessen, Fenster 1280x900, Bilder je 1,2 s verzoegert: mit
    # Attributen allein steht kmeans bei 450 ms auf 20.120 px Dokumenthoehe statt auf
    # 13.866 -- bricht aber bei ~1,7 s auf 14.354 ein. Mit dem Stylesheet bleibt es bei
    # 20.120, und die gerenderten Bildgroessen sind in beiden Fassungen gleich
    # (536x585, 722x796, ...). Der Sprung, den die Hydration selbst macht (CLS 0,2556 in
    # vier von sechs Laeufen, in beiden Fassungen), bleibt davon unberuehrt.
    - python3 tools/image_dims.py public --base "$BASE_URL"
    # Und derselbe Griff fuer den Kasten der Artikel-Gliederung, der *den* Sprung macht,
    # den die Zeile darueber als "bleibt davon unberuehrt" fuehrte. Das Theme liefert ihn
    # mit leerem <nav> aus und fuellt ihn nach dem Mount; unterhalb von lg steht er im
    # Fluss, also faellt alles darunter in dem Moment nach unten. Am 2026-10-29 bei
    # 375x812 am Live-Stand gemessen: der erste Absatz rutscht um 296 px auf der
    # Startseite, 392 px auf /kmeans/, 696 px auf /expectation-maximization/. Mit der
    # Reservierung in allen drei Faellen 0. Dieselbe Ursache, die ds-en am 2026-10-18 mit
    # 88c5664 behoben hat; dort danach CLS 0 statt 0,153 und 0,278.
    #
    # Auch hier zwei Stellen und aus demselben Grund nur eine davon im Koerper: ds-en
    # setzt eine Custom Property an den Kasten, das ueberlebt hier das Neurendern nicht,
    # also steht die Hoehe als <style id="gliederungsplatz"> im Kopf und der Selektor
    # greift die eigenen Klassen des Themes. Vor hydration.py, dessen Waechter ihn haelt.
    - python3 tools/outline_reserve.py public
    # Kapitellinks auf die URL bringen, die 200 liefert. MyST verlinkt "/ds-skript/kmeans",
    # GitLab Pages antwortet darauf mit 302 auf "/ds-skript/kmeans/" -- am 2026-10-29
    # gemessen rund 40 ms je Link, auf derselben Verbindung. Canonical und Sitemap nennen
    # die Form mit Schraegstrich seit d929f14; die Links taten es nicht.
    #
    # Zwei Stellen, und diesmal traegt wirklich nur die zweite ueber die Hydration: ein
    # href im Markup wird vom Neurendern aus der Nutzlast ueberschrieben, mit Proxy und
    # Marken je Feld nachgewiesen. Geschrieben wird beides, weil das ausgelieferte
    # Dokument ist, was ein Crawler ohne JavaScript liest -- derselbe Grund wie beim
    # loading="lazy" in head_meta.py.
    #
    # Die Seitenleiste bleibt ohne Schraegstrich, und das ist eine Entscheidung: ihr href
    # kommt aus dem Slug, und ein Schraegstrich dort kostet gemessen die Vorschaukarten
    # aller Links im Artikel und die aufgeklappte Gruppe der aktuellen Seite. Von 502
    # hrefs tragen danach alle den Schraegstrich, nach der Hydration noch 285.
    - python3 tools/trailing_slash.py public --base "$BASE_URL"
    # Loest jeden url() der eingebundenen Stylesheets auf -- gegen die Datei, die im <link>
    # steht, nicht gegen eine, von der man annimmt, sie werde geladen. Genau diesen Schritt
    # hatte meine erste Pruefung uebersprungen; sie meldete "DA" an der fingerprinted Kopie,
    # die der Browser nie laedt. Deckt zugleich die zwanzig KaTeX-Schriften ab, die ihr
    # Stylesheet relativ zu sich selbst nennt.
    - python3 tools/check_css_assets.py public --base "$BASE_URL"
    # hreflang: die deutsche Haelfte des Sprachpaars. Muss *nach* dem Canonical laufen -- der
    # Selbstverweis muss exakt die URL sein, die die Seite canonical nennt, sonst erklaert sich
    # die Seite nicht zum Mitglied ihres eigenen Clusters. hreflang/filemap.json kommt entweder
    # frisch aus hreflang-map oder, wenn der Abruf scheiterte, aus dem Repo.
    - python3 tools/hreflang.py public hreflang/filemap.json "$SITE" "$EN_SITE_ORIGIN"
    # Und danach am gebauten public/ nachzaehlen statt dem Log zu glauben. Melden genuegt hier
    # nicht: ein fehlendes Sprachpaar ist im Browser unsichtbar, steht nur im Log und ist von
    # aussen allein durch Nachmessen zu finden -- derselbe Fehlertyp wie die localhost-Sitemap.
    # Die Sollwerte zieht das Skript aus der filemap, ein neues Kapitel aendert hier also nichts.
    - python3 tools/hreflang.py --verify public hreflang/filemap.json
    # --- Aktualitaet, strukturierte Daten, Markdown-Auslieferung -----------------------
    # Datum je Seite aus "git log" der Quelldatei, nicht aus der Bauzeit: ein Bau am Dienstag
    # macht ein Kapitel von 2024 nicht frisch. Setzt article:modified_time in jeden <head> und
    # <lastmod> in jeden Sitemap-Eintrag (vorher null von 32). Braucht die volle Historie,
    # siehe GIT_DEPTH unten -- bei einem flachen Klon bricht das Skript lieber ab, als zu raten.
    - python3 tools/freshness.py public
    # JSON-LD nur auf die Landingpage, Buch als Ganzes. Muss *nach* freshness.py laufen (liest
    # dateModified aus der Seite zurueck) und *nach* der og:image-Absolutmachung oben.
    - python3 tools/inject_jsonld.py "$SITE" public
    # llms.txt, llms-full.txt und der Markdown-Quelltext je Kapitel. Steht bewusst zuletzt:
    # Google ignoriert llms.txt erklaertermassen, der Nutzen liegt bei den .md-Dateien.
    - python3 tools/llms_txt.py "$SITE" public
    # --- Was die Hydration anfasst -----------------------------------------------------
    # **Letzter Kopf-Schritt, und das ist keine Vorliebe.** Dieses Theme rendert den <head>
    # bei der Hydration aus den Route-Modulen neu und wirft die nachgetragenen Tags weg --
    # am 2026-10-20 im Browser gemessen, am 2026-10-29 in der Search Console an Googles
    # gerenderter Fassung bestaetigt (TODO Zeile 1d). Das Skript liest die Tags, die die
    # Schritte oben in den Kopf geschrieben haben, aus dem Kopf zurueck und haengt einen
    # MutationObserver dazu, der sie nach der Hydration wieder einsetzt -- derselbe Griff,
    # mit dem lang="de" seit dem 2026-10-16 haelt. Steht es vor einem Schritt, der noch
    # Tags schreibt, haelt es die nicht mehr; sein --check bricht dann ab.
    #
    # Dabei auch page.domain in der Nutzlast: MyST schreibt dort die Origin seines eigenen
    # Dev-Servers hinein ("http://localhost:3000", je Dokument einmal und genauso in jedem
    # Seiten-JSON daneben). Heute liest das kein Route-Modul, es ist also wirkungslos --
    # aber es ist dieselbe Klasse wie die localhost-Sitemap oben.
    - python3 tools/hydration.py "$SITE" public --base "$BASE_URL"
    # Und wieder am gebauten public/ nachzaehlen statt dem Log zu glauben.
    - python3 tools/freshness.py --check public
    # Dasselbe fuer die Abbildungsmasse, und bewusst hier unten: zwischen dem Schreiben
    # und dieser Zeile liegen alle Schritte, die noch am Markup drehen. Geprueft wird
    # nicht, was der Lauf getan hat, sondern was am Ende dasteht -- jede Abbildung mit
    # den Massen *ihrer* Datei, und dazu das Stylesheet, das genau zu ihnen passt und im
    # Kopf vor dem Waechter steht. Falsche Masse halten Platz frei, nur den falschen.
    - python3 tools/image_dims.py public --base "$BASE_URL" --check
    # Und dasselbe fuer die Gliederung, aus demselben Grund hier unten. Geprueft wird die
    # Eingabe der Rechnung: die Ueberschriften, die am Ende in <main> stehen, gegen die
    # Hoehe, die im Kopf steht. Die gerenderte Hoehe ist zur Bauzeit nicht behauptbar --
    # ein umgebrochener Eintrag ist 24 px hoeher, und das weiss nur eine Schriftmetrik.
    - python3 tools/outline_reserve.py --check public
    # Und dasselbe fuer die Kapitellinks, hier unten aus demselben Grund: dazwischen
    # liegen alle Schritte, die noch am Markup und an der Nutzlast drehen. Geprueft wird
    # das Ergebnis und nicht die Zahl der Aenderungen -- ein zweiter Lauf aendert null und
    # muss gruen sein --, und zwar in allen drei Fassungen derselben Angabe: Markup,
    # Hydrations-Nutzlast und Seiten-JSON.
    - python3 tools/trailing_slash.py --check public --base "$BASE_URL"
    # Kontrolle: bricht den Job ab, falls doch eine localhost-URL ueberlebt hat.
    # Als Block-Skalar, nicht als einzeilige Sequenz: eine unquotierte Zeile mit ": " darin
    # liest GitLab als Mapping statt als Kommando und lehnt die ganze Datei ab ("script config
    # should be a string or a nested array of strings"). Dann laeuft *kein einziger* Job.
    - |
      if grep -rq "localhost:3000" public/sitemap.xml public/robots.txt; then
        echo "FEHLER: localhost-URL in sitemap.xml oder robots.txt ueberlebt"
        exit 1
      fi
      # Und kein Stylesheet mehr von einem CDN. Gegrept werden die drei *URLs*, nicht
      # die Hostnamen: thebes Laufzeit holt Pyodide, MathJax und require.js weiter von
      # dort, und zwar erst, wenn ein Leser ein Notebook lebendig macht. Ein Waechter
      # auf die Hostnamen waere nur zu befriedigen, indem man thebe loescht. Das Buch
      # zu lesen kontaktiert keinen Dritten; den Code darin laufen zu lassen schon.
      # find statt "grep -r --include": der Job laeuft in python:3.13-alpine, und dessen
      # grep ist busybox. "--include" ist eine GNU-Erweiterung; busybox antwortet
      # "grep: unrecognized option: include=*.html" und Rueckgabewert 2. Am 2026-10-16
      # im Image nachgestellt, nachdem genau das hier gestanden hatte.
      ziele=$(find public -name '*.html' -o -name '*.js')
      for u in \
        "cdn.jsdelivr.net/npm/katex@" \
        "cdnjs.cloudflare.com/ajax/libs/font-awesome/" \
        "cdn.jsdelivr.net/npm/jupyter-matplotlib@"; do
        if echo "$ziele" | xargs grep -l "$u" 2>/dev/null | head -1 | grep -q .; then
          echo "FEHLER: ein Stylesheet wird weiter vom CDN geholt: $u"
          echo "$ziele" | xargs grep -l "$u" 2>/dev/null | sed 's|^|  |' | head -5
          exit 1
        fi
      done
      # Gegenprobe, damit der Waechter nicht gruen ist, weil das Theme die Stylesheets
      # gar nicht mehr laedt: die vendorierten Pfade muessen referenziert UND da sein.
      for f in vendor/katex/katex.min.css vendor/font-awesome/css/font-awesome.css \
               vendor/jupyter-matplotlib/mpl_widget.css; do
        [ -s "public/$f" ] || { echo "FEHLER: public/$f fehlt"; exit 1; }
        find public -name '*.html' | xargs grep -l "$f" >/dev/null 2>&1 || { echo "FEHLER: $f wird von keiner Seite referenziert"; exit 1; }
      done
      echo "ok: kein CDN-Stylesheet mehr, drei vendorierte Pfade referenziert und vorhanden"
    # --- Vorkompression ------------------------------------------------------------------
    # GitLab Pages komprimiert nichts von sich aus -- am 2026-10-16 am Live-Stand gemessen:
    # kein content-encoding, auch nicht mit "Accept-Encoding: gzip, deflate, br", und im
    # Browser transferSize 6.567 kB gegen decodedBodySize 6.580 kB. Es liefert aber eine
    # daneben liegende .gz oder .br aus, wenn eine da ist (so dokumentiert). Also beide
    # hinlegen: 5.251 kB -> 1.470 kB je Aufruf der Landingpage mit gzip, 72 % weniger.
    #
    # Seit dem 2026-10-20 auch .br, nachdem der Live-Nachweis fuer gzip da war -- dass diese
    # Instanz eine daneben liegende Datei ueberhaupt ausliefert, war die Voraussetzung, und
    # sie ist gemessen: content-encoding: gzip, 153.464 -> 33.670 Bytes auf der Startseite.
    # Pages bevorzugt .br, wenn beide daneben liegen; die .gz bleibt die Rueckfallebene.
    #
    # **Muss der letzte Schritt sein.** Ab hier existiert jede Textdatei zweimal, und die
    # .gz ist das, was praktisch jeder Leser bekommt. Stuende dieser Schritt vor einer der
    # Umschreibungen oben, lieferte die Seite allen Browsern die alte Fassung aus, waehrend
    # curl ohne Accept-Encoding und jeder Blick ins Artefakt die neue zeigen -- derselbe
    # Fehlertyp wie die localhost-Sitemap und die Schriften hinter dem relativen url().
    - python3 tools/precompress.py public
    # Und nachmessen statt der Meldung zu glauben: --check packt jede .gz wieder aus und
    # vergleicht byteweise. Die vier Fehlerfaelle (veraltet, fehlend, defekt, verwaist) sind
    # am 2026-10-16 lokal gegen das gebaute Artefakt durchgespielt, jeder einzeln rot.
    - python3 tools/precompress.py public --check
  variables:
    # freshness.py liest das Datum je Kapitel aus "git log" der Quelldatei. GitLab klont
    # standardmaessig flach (GIT_DEPTH 20); eine seit zwanzig Commits unberuehrte Datei haette
    # dann keinen Eintrag, und das Skript braeche ab. Also volle Historie fuer diesen Job.
    GIT_DEPTH: "0"
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
# Spiegelt das Repo nach GitHub. GitLab bleibt fuehrend; nichts ausser diesem Job schreibt
# jemals in den Spiegel, ds-en liest ihn nur.
#
# **Warum ueberhaupt.** Die HHU-GitLab gibt Git ueber HTTP nur Eingeloggten: die Projektseite
# antwortet 200, /info/refs?service=git-upload-pack antwortet 401, und die API meldet trotzdem
# "public" -- oeffentlich fuer den Browser, geschlossen fuer einen Klon. Ein GitHub-Runner
# kommt also nicht an uns heran, und ds-ens Staleness-Check ist deshalb seit seinem Bestehen
# kein einziges Mal durchgelaufen. Kein Retry ueberlebt ein 401. Zweiter Grund, Konrads: auf
# GitHub lassen sich Issues leichter anlegen, der Spiegel ist also auch die Meldestelle fuer
# die deutsche Ausgabe.
#
# Kein allow_failure. Ein still scheiternder Spiegel ist schlechter als keiner: ds-en
# vergliche dann gegen eine eingefrorene Kopie und meldete ewig "up to date" -- genau der
# stille Erfolg, den der Check verhindern soll.
#
# Was hier rausgeht, vor dem Einbau geprueft: genau ein Branch, main, keine Tags, 207
# Commits. todo/, transcripts/, PROJECT_NOTES.md und TODO.md kommen in keinem Commit der
# Historie vor -- sie waren nie drin, nicht nur heute ignoriert. Keine Treffer auf gaengige
# Token-Muster. Der Buchinhalt ist ohnehin CC BY-SA.
mirror-to-github:
  stage: deploy
  # entrypoint: [""] ist noetig, nicht Kosmetik: alpine/git setzt git selbst als Entrypoint,
  # der Runner haengt seinen Shell-Aufruf hinten an, und der Job stirbt sofort mit
  # "git: 'sh' is not a git command". Genau so ist der erste Versuch gescheitert.
  image:
    name: alpine/git:latest
    entrypoint: [""]
  variables:
    GIT_STRATEGY: none
  # Ohne das zieht der Job die Artefakte der build-Stage -- Website und PDF, zweistellige
  # Megabyte -- fuer nichts: er klont ja selbst.
  dependencies: []
  script:
    # Frueh und verstaendlich abbrechen, statt in einen anonymen Push zu laufen, der mit
    # "Authentication failed" endet und wie ein GitHub-Problem aussieht.
    - test -n "$GITHUB_MIRROR_TOKEN" || { echo "FEHLER - CI-Variable GITHUB_MIRROR_TOKEN fehlt"; exit 1; }
    # Das Token steht bewusst nicht in der Push-URL. GitLab maskiert es zwar im Log, aber die
    # Maskierung greift nur auf exakte Treffer, und eine Remote-URL taucht in git-Fehlern, in
    # Trace-Ausgaben und in Fremdwerkzeugen an Stellen auf, die man nicht alle kennt. Der
    # Credential-Store liegt im Container und verschwindet mit ihm.
    - git config --global credential.helper store
    - printf 'https://x-access-token:%s@github.com\n' "$GITHUB_MIRROR_TOKEN" > ~/.git-credentials
    - chmod 600 ~/.git-credentials
    # Spiegelklon, damit die echte Historie mitkommt: ds-en loest beliebige Commits auf
    # (git show <sha>:<datei> zwischen zwei Pins) und braucht nicht nur eine Spitze.
    - git clone --mirror "$CI_REPOSITORY_URL" repo.git
    # Explizite Refspecs statt --mirror. --mirror schickt *jede* Ref, die der Klon kennt, und
    # ein Klon ueber CI_REPOSITORY_URL kennt auch GitLabs interne refs/pipelines/<id> -- eine
    # pro Lauf, die sich im Spiegel ewig ansammeln wuerden. Der erste erfolgreiche Lauf hat
    # genau das getan. Heads und Tags sind, was ds-en braucht; --prune raeumt drueben auf,
    # was hier geloescht wurde, bleibt dabei aber innerhalb dieser beiden Refspecs.
    - |
      git -C repo.git push --prune https://github.com/konradvoelkel/ds-skript-mirror.git \
        "+refs/heads/*:refs/heads/*" "+refs/tags/*:refs/tags/*"
    - git -C repo.git rev-parse HEAD
  retry: 2
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH



# Sagt der englischen Ausgabe (github.com/konradvoelkel/ds-en) Bescheid, dass hier gepusht
# wurde, damit sie ihren Staleness-Check fahren kann. Der event_type "ds-skript-push" ist
# vereinbart und steht so in ds-ens .github/workflows/upstream.yml — nicht umbenennen.
#
# Warum dieser Weg und nicht ein Zeitplan drüben: ein Push ist ein Zeitpunkt, an dem beide
# Seiten gerade nachweislich erreichbar sind. Das ist hier die ganze Begründung — die
# ursprüngliche ("GitHubs Runner erreichen die HHU-GitLab nicht, hinausrufen geht dagegen")
# hat sich am 2026-10-15 als falsch erwiesen: siehe retry unten.
#
# **Kein allow_failure, mit Absicht.** Ein abgelaufenes Token sähe auf der GitHub-Seite genau
# so aus wie "am Original hat sich nichts geändert"; diese Stille ist die eigentliche Gefahr.
# Hier ist ein roter Job das Signal. Die API antwortet mit 204 ohne Inhalt, -f lässt curl bei
# allem anderen scheitern — auch bei einem leeren $GH_DISPATCH_TOKEN (dann 401).
#
# **Warum trotzdem retry** — und warum das dem Satz darüber nicht widerspricht: Die Strecke
# zwischen HHU und der Außenwelt flattert, in beide Richtungen. Am 2026-10-15 brauchte dieser
# Job drei Anläufe auf demselben Runner (12 s Ablehnung, 133 s Connect-Timeout, dann 25 s
# Erfolg), im selben Fenster lief ein build-web nach 149 s in denselben Timeout gegen PyPI,
# und umgekehrt klonte ein GitHub-Runner die HHU-GitLab anstandslos. Ein Netzaussetzer darf
# deshalb nicht wie ein kaputtes Token aussehen. Ein kaputtes Token sieht nach wie vor rot
# aus: ein 401 bleibt ein 401, auch beim dritten Versuch.
#
# GH_DISPATCH_TOKEN ist eine maskierte, geschützte CI-Variable. "Geschützt" heißt: sie wird
# nur an Jobs auf einem geschützten Branch ausgegeben. main ist seit dem 2026-10-15 geschützt
# (push_access_level 40, Maintainers); wird der Schutz je aufgehoben, ist die Variable leer,
# GitHub antwortet 401 und der Job ist rot — ohne dass irgendwo "Variable fehlt" stünde.
notify-ds-en:
  stage: deploy
  image: curlimages/curl:latest
  script:
    # --connect-timeout 20 statt der voreingestellten 300: ein toter Connect laeuft sonst erst
    # nach 133 s in den Kernel-Timeout, und ein Job, der zweieinhalb Minuten haengt und dann
    # wortlos rot wird, ist das schlechteste aller Signale. --retry faengt den Aussetzer
    # innerhalb desselben Jobs ab, damit im Log *eine* Geschichte steht statt dreier Jobs.
    - |
      curl -fsS -X POST \
        --connect-timeout 20 --max-time 90 \
        --retry 3 --retry-delay 5 --retry-all-errors \
        -H "Accept: application/vnd.github+json" \
        -H "Authorization: Bearer $GH_DISPATCH_TOKEN" \
        -H "X-GitHub-Api-Version: 2022-11-28" \
        https://api.github.com/repos/konradvoelkel/ds-en/dispatches \
        -d "{\"event_type\":\"ds-skript-push\",\"client_payload\":{\"sha\":\"$CI_COMMIT_SHA\"}}"
  # Zweite Ebene: faengt ab, was curl nicht sieht — ein fehlgeschlagener Image-Pull etwa.
  # Erst spiegeln, dann Bescheid sagen. Ohne das laufen beide Jobs gleichzeitig los, und
  # ds-en klont den Spiegel womoeglich, bevor dieser Push drin ist -- der Check urteilte dann
  # gegen den vorherigen Stand und meldete "up to date", obwohl sich gerade etwas bewegt hat.
  # Faellt der Spiegel aus, wird dieser Job uebersprungen: lieber keine Meldung als eine, die
  # auf eine veraltete Kopie zeigt.
  needs: ["mirror-to-github"]
  retry: 2
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
