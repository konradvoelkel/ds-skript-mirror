stages:
  - build
  - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  BASE_URL: "" # "/$CI_PROJECT_NAME"
  HOST: "127.0.0.1"
  
cache:
  paths:
    - .cache/pip

myst-build:
  stage: build
  image: nikolaik/python-nodejs:python3.14-nodejs26-slim # $CI_REGISTRY_IMAGE:latest
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends procps
  script:
    - python -V
    - node -v
    - npm -v
    - npm install -g mystmd
    - python -m pip install --upgrade pip
    - python -m pip install -r requirements.txt
    - myst build --html
    #- myst build --pdf
    
  artifacts:
    paths:
      - _build/html
      - export

pages:
  stage: deploy
  image: busybox:latest
  script:
    - mv _build/html public
    #- mv export/ds-skript.pdf public/
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
